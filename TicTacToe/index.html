<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de tres en rayas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1a2b33]">
    <div class="h-screen w-screen flex flex-col items-center">

        <div class="text-center mt-7">
            <div class="text-2xl font-bold">
                <div class="text-[#f2b136]">Tic Tac</div>
                <div class="text-[#30c1bb]">Toe Game</div>
            </div>
        </div>
        
        <div class="flex mt-7 gap-8">
            <div class="h-8 w-24 flex justify-center">
                <div class="text-[#30c1bb] font-bold text-3xl items-center">X</div>
                <div class="text-[#f2b136] font-bold text-3xl items-center">O</div>
            </div>
            <div id="turnIndicator" class="h-8 w-24 flex items-center justify-center bg-[#1f3540] rounded-lg shadow-sm shadow-black">
                <div class="text-[#a9bfca] font-bold text-md">TURN</div>
            </div>
            <div class="h-8 w-24 flex items-center justify-center">
                <div class="restart h-8 w-8 flex items-center justify-center bg-[#a7bdc8] rounded-lg shadow-sm shadow-[#758d99]">
                    <img class="h-2/3 w-2/3" src="icon.png">
                </div>
            </div>        
        </div>

        <div id="board" class="mt-4">
            <div class="flex gap-8">
                <div class="cell h-24 w-24 flex items-center justify-center bg-[#1f3540] rounded-2xl shadow-md shadow-black cursor-pointer"></div>
                <div class="cell h-24 w-24 flex items-center justify-center bg-[#1f3540] rounded-2xl shadow-md shadow-black cursor-pointer"></div>
                <div class="cell h-24 w-24 flex items-center justify-center bg-[#1f3540] rounded-2xl shadow-md shadow-black cursor-pointer"></div>
            </div>
            <div class="flex gap-8 mt-4">
                <div class="cell h-24 w-24 flex items-center justify-center bg-[#1f3540] rounded-2xl shadow-md shadow-black cursor-pointer"></div>
                <div class="cell h-24 w-24 flex items-center justify-center bg-[#1f3540] rounded-2xl shadow-md shadow-black cursor-pointer"></div>
                <div class="cell h-24 w-24 flex items-center justify-center bg-[#1f3540] rounded-2xl shadow-md shadow-black cursor-pointer"></div>
            </div>
            <div class="flex gap-8 mt-4">
                <div class="cell h-24 w-24 flex items-center justify-center bg-[#1f3540] rounded-2xl shadow-md shadow-black cursor-pointer"></div>
                <div class="cell h-24 w-24 flex items-center justify-center bg-[#1f3540] rounded-2xl shadow-md shadow-black cursor-pointer"></div>
                <div class="cell h-24 w-24 flex items-center justify-center bg-[#1f3540] rounded-2xl shadow-md shadow-black cursor-pointer"></div>
            </div>
        </div>

        <div class="flex mt-6 gap-8">
            <div id="win" class="h-14 w-24 flex items-start justify-center bg-[#31c4be] rounded-2xl shadow-md shadow-black text-xs font-bold">
            </div>
            <div id="ties" class="h-14 w-24 flex items-start justify-center bg-[#a8bec9] rounded-2xl shadow-md shadow-black text-xs font-bold">
            </div>
            <div id="lose" class="h-14 w-24 flex items-start justify-center bg-[#f2b237] rounded-2xl shadow-md shadow-black text-xs font-bold">
            </div>        
        </div>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const restartButton = document.querySelector('.restart');
        const turnIndicator = document.getElementById('turnIndicator');
        let currentPlayer = 'X';

        let wins = 0;
        let losses = 0;
        let ties = 0;

        function updateTurnIndicator() {
            if (currentPlayer == 'O') {
                turnIndicator.innerHTML = `<div class="text-[#f2b136] font-bold text-lg">${currentPlayer}</div>`;
            } else {
                turnIndicator.innerHTML = `<div class="text-[#30c1bb] font-bold text-lg">${currentPlayer}</div>`;
            }
        }

        function checkWinner() {
            const winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (const combination of winningCombinations) {
                const [a, b, c] = combination;

                if (
                    cells[a].textContent !== '' && 
                    cells[a].textContent === cells[b].textContent && 
                    cells[a].textContent === cells[c].textContent
                ) {

                    cells.forEach(cell => cell.removeEventListener('click', turno));

                    if (cells[a].textContent === 'X') {
                        wins++;
                        updateStatistics();
                        setTimeout(() => alert('¡X ha ganado!'), 100);
                    } else if (cells[a].textContent === 'O') {
                        losses++;
                        updateStatistics();
                        setTimeout(() => alert('¡O ha ganado!'), 100);
                    }

                    return true;
                }
            }

            return false;
        }


        function checkTie() {
            const allFilled = [...cells].every(cell => cell.textContent !== '');
            if (allFilled && !checkWinner()) {
                ties++;
                updateStatistics();
                setTimeout(() => alert('¡Es un empate!'), 100);
            }
        }

        function updateStatistics() {
            document.getElementById('win').textContent = `Wins: ${wins}`;
            document.getElementById('lose').textContent = `Losses: ${losses}`;
            document.getElementById('ties').textContent = `Ties: ${ties}`;
        }

        function turno() {
            if (this.textContent === '') { 
                this.textContent = currentPlayer; 
                this.classList.add(
                    currentPlayer === 'X' ? 'text-[#30c1bb]' : 'text-[#f2b136]', 
                    'font-bold', 
                    'text-4xl'
                ); 

                if (!checkWinner()) {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    updateTurnIndicator();
                    checkTie(); 
                }
            }
        }

        function resetBoard() {
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('text-[#30c1bb]', 'text-[#f2b136]', 'font-bold', 'text-4xl', 'bg-green-500');
            });
            currentPlayer = 'X';
            updateTurnIndicator();
            cells.forEach(cell => cell.addEventListener('click', turno));
        }

        cells.forEach(cell => {
            cell.addEventListener('click', turno);
        });
        restartButton.addEventListener('click', resetBoard);
        updateStatistics();

    </script>
</body>
</html>
